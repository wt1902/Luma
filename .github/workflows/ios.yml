name: Build Unsigned iOS ipa
on:
  push:
    branches:
      - main
      - develop
      - issue-*
  pull_request:
    branches:
      - main
      - develop
jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Build Xcode Workspace
        run: |
          xcodebuild build \
            -project Luma.xcodeproj \
            -scheme Luma \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          mv build/DerivedData/Build/Products/Release-iphoneos/Luma.app build/Payload/
          cd build && zip -r Luma.ipa Payload/
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luma${{ github.run_id }}
          path: build/Luma.ipa
